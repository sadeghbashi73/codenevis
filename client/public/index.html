<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>codenevis</title>
<link rel="stylesheet" href="style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🤖</text></svg>">
</head>
<body>

<div class="app">

  <aside class="sidebar">
    <a class="brand" href="#/">
      <span class="brand-mark">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 3h6v3h3v5a6 6 0 0 1-12 0V6h3V3Z"/><path d="M9 11h.01M15 11h.01M6 21h12"/>
        </svg>
      </span>
      <span class="brand-text">
        <b>codenevis</b>
        <small id="brandRepo"></small>
      </span>
    </a>

    <nav id="nav"></nav>

    <footer class="sidebar-foot">
      <span class="pulse" id="pulse"></span>
      <button class="lang-toggle" id="langToggle">EN</button>
    </footer>
  </aside>

  <div class="content">
    <header class="topbar">
      <button class="btn icon only-narrow" id="menuBtn" aria-label="menu">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <div class="topbar-spacer"></div>
      <button class="btn icon" id="refreshBtn" aria-label="refresh">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.3-5.6M20 4v5h-5"/></svg>
      </button>
      <button class="btn" id="continueBtn"></button>
      <button class="btn primary" id="newProjectBtn"></button>
    </header>

    <main id="main"></main>
  </div>

  <div class="nav-scrim" id="scrim"></div>
</div>

<dialog id="briefDialog">
  <form method="dialog" id="briefForm">
    <h3 id="dlgTitle"></h3>
    <p class="hint" id="dlgHint"></p>
    <div class="field">
      <label for="briefTitle" id="lblTitle"></label>
      <input id="briefTitle" required>
    </div>
    <div class="field">
      <label for="briefBody" id="lblBody"></label>
      <textarea id="briefBody" rows="9" required></textarea>
    </div>
    <label class="check">
      <input type="checkbox" id="briefStart" checked>
      <span id="lblStart"></span>
    </label>
    <div class="right mt">
      <button class="btn" value="cancel" id="dlgCancel"></button>
      <button class="btn primary" value="create" id="dlgCreate"></button>
    </div>
  </form>
</dialog>

<div id="toast" class="toast"></div>

<script type="module" src="app.js"></script>
</body>
</html>
