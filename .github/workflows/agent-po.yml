name: PO agent

# Planning on its own — turn one brief into a PRD and a backlog, without
# starting any implementation. Useful when you want to read and edit the plan
# before the developer agent touches anything.

on:
  workflow_dispatch:
    inputs:
      brief_issue:
        description: 'Issue number holding the project brief'
        required: true
        type: string

concurrency:
  group: codenevis-pipeline
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: node agents/po.mjs
        env:
          PO_API_KEY: ${{ secrets.PO_API_KEY }}
          CODENEVIS_API_KEY: ${{ secrets.CODENEVIS_API_KEY }}
          PO_MODEL: ${{ vars.PO_MODEL }}
          PO_PROVIDER: ${{ vars.PO_PROVIDER }}
          PO_BASE_URL: ${{ vars.PO_BASE_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
          BRIEF_ISSUE: ${{ inputs.brief_issue }}
